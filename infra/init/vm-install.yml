#cloud-config

ssh_pwauth: no
package_update: true
package_upgrade: true

users:
  - default
  - name: ${VM_USERNAME}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${SSH_KEY}

write_files:
  - path: /usr/local/bin/kittygram-install-docker.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail

      apt-get update
      apt-get install -y ca-certificates curl gnupg

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc

      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list

      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      systemctl enable docker
      systemctl start docker
      usermod -aG docker ${VM_USERNAME}

runcmd:
  - [ bash, /usr/local/bin/kittygram-install-docker.sh ]
  - [ mkdir, -p, /home/${VM_USERNAME}/kittygram ]
  - [ chown, -R, ${VM_USERNAME}:${VM_USERNAME}, /home/${VM_USERNAME}/kittygram ]
