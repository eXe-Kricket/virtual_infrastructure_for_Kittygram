name: Kittygram CI/CD

on:
  push:
    branches:
      - main

jobs:
  lint_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint backend (PEP8)
        run: flake8 backend/

  tests_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend and infra tests
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_files.py

  frontend_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false

  build_and_push:
    runs-on: ubuntu-latest
    needs:
      - lint_backend
      - tests_backend
      - frontend_tests
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_frontend:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_gateway:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    outputs:
      kittygram_url: ${{ steps.vm.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra
        run: >
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="access_key=${{ secrets.ACCESS_KEY }}"
          -backend-config="secret_key=${{ secrets.SECRET_KEY }}"

      - name: Read VM address from Terraform state
        id: vm
        working-directory: infra
        env:
          GATEWAY_PORT: ${{ vars.GATEWAY_PORT || '9003' }}
        run: |
          VM_HOST="$(terraform output -raw external_ip_address)"
          echo "host=${VM_HOST}" >> "$GITHUB_OUTPUT"
          echo "url=http://${VM_HOST}:${GATEWAY_PORT}" >> "$GITHUB_OUTPUT"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.vm.outputs.host }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: docker-compose.production.yml
          target: ~/kittygram/
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.vm.outputs.host }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            cd ~/kittygram

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            cat > .env << 'EOF'
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DB_HOST=postgres
            DB_PORT=5432
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            EOF

            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d

            docker compose -f docker-compose.production.yml exec -T postgres sh -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'
            docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate
            docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput

  post_deploy_tests_and_notify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps for post-deploy tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests PyYAML

      - name: Prepare deploy info for tests
        run: |
          cat > tests.yml << EOF
          repo_owner: ${GITHUB_REPOSITORY_OWNER}
          kittygram_domain: ${{ needs.deploy.outputs.kittygram_url }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          EOF

      - name: Run post-deploy tests
        run: |
          pytest -q tests/test_connection.py
          pytest -q tests/test_dockerhub_images.py

      - name: Telegram notify
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Kittygram deploy succeeded!

            Author: ${{ github.actor }}
            Commit: ${{ github.event.commits[0].message }}
            Link: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
