services:
  postgres:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - static:/code/collected_static
      - media:/code/media
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    command: sh -c "cp -r /app/build/* /static/ && exec npx -y http-server -p 8000 /app/build"
    volumes:
      - static:/static

  gateway:
    build: ./nginx
    ports:
      - "9002:80"
    volumes:
      - static:/static
      - media:/media
    depends_on:
      - backend
      - frontend

volumes:
  static:
  media:
  pg_data: