name: Terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: Select the Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
      TF_VAR_yc_token: ${{ secrets.YC_TOKEN }}
      TF_VAR_yc_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_yc_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_access_key: ${{ secrets.ACCESS_KEY }}
      TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_vm_username: ${{ secrets.SSH_USER || 'ubuntu' }}
      TF_VAR_app_bucket_name: ${{ secrets.APP_BUCKET_NAME }}
      TF_VAR_gateway_port: ${{ vars.GATEWAY_PORT || '9003' }}
      TF_ACTION: ${{ github.event.inputs.action || 'plan' }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check Terraform secrets
        run: |
          missing=0
          for name in ACCESS_KEY SECRET_KEY TF_STATE_BUCKET YC_TOKEN YC_CLOUD_ID YC_FOLDER_ID SSH_PUBLIC_KEY APP_BUCKET_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub secret ${name} is required for Terraform"
              missing=1
            fi
          done
          exit "$missing"
        env:
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          YC_TOKEN: ${{ secrets.YC_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          APP_BUCKET_NAME: ${{ secrets.APP_BUCKET_NAME }}

      - name: Terraform Init
        run: >
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="access_key=${{ secrets.ACCESS_KEY }}"
          -backend-config="secret_key=${{ secrets.SECRET_KEY }}"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: ${{ env.TF_ACTION == 'plan' }}
        run: terraform plan

      - name: Terraform Apply
        if: ${{ env.TF_ACTION == 'apply' }}
        run: terraform apply -auto-approve

      - name: Save VM IP
        if: ${{ env.TF_ACTION == 'apply' && success() }}
        run: terraform output -raw external_ip_address > vm_ip.txt

      - name: Upload VM IP artifact
        if: ${{ env.TF_ACTION == 'apply' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: vm-ip
          path: infra/vm_ip.txt

      - name: Terraform Destroy
        if: ${{ env.TF_ACTION == 'destroy' }}
        run: terraform destroy -auto-approve
