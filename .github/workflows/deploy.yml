name: Kittygram CI/CD

on:
  workflow_run:
    workflows: ["Terraform"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.verify.outputs.run_ci }}
    steps:
      - name: Only after successful Terraform apply
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_ID="${{ github.event.workflow_run.id }}"
          APPLY=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name=="terraform") | .steps[] | select(.name=="Terraform Apply") | .conclusion' | head -n1)

          if [ "$APPLY" = "success" ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
          fi

  lint_backend:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ needs.gate.outputs.run_ci == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint backend (PEP8)
        run: flake8 backend/

  tests_backend:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ needs.gate.outputs.run_ci == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend and infra tests
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_files.py

  frontend_tests:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ needs.gate.outputs.run_ci == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false

  build_and_push:
    runs-on: ubuntu-latest
    needs:
      - lint_backend
      - tests_backend
      - frontend_tests
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_frontend:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_gateway:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    outputs:
      kittygram_url: ${{ steps.read-ip.outputs.kittygram_url }}
    steps:
      - name: Download VM IP artifact
        uses: actions/download-artifact@v4
        with:
          name: vm-ip
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read VM IP
        id: read-ip
        env:
          GATEWAY_PORT: ${{ vars.GATEWAY_PORT || '9003' }}
        run: |
          VM_IP="$(cat vm_ip.txt | xargs)"
          echo "vm_ip=${VM_IP}" >> "$GITHUB_OUTPUT"
          echo "kittygram_url=http://${VM_IP}:${GATEWAY_PORT}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.read-ip.outputs.vm_ip }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: docker-compose.production.yml
          target: ~/kittygram/
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.read-ip.outputs.vm_ip }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            cd ~/kittygram

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            cat > .env << 'EOF'
            POSTGRES_DB=${{ secrets.POSTGRES_DB || 'kittygram' }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER || 'kittygram_user' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'kittygram_password' }}
            DB_HOST=postgres
            DB_PORT=5432
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            EOF

            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml down
            docker compose -f docker-compose.production.yml up -d

            docker compose -f docker-compose.production.yml exec -T postgres sh -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'
            docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate
            docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput

  post_deploy_tests_and_notify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps for post-deploy tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests PyYAML

      - name: Prepare deploy info for tests
        run: |
          cat > tests.yml << EOF
          repo_owner: ${GITHUB_REPOSITORY_OWNER}
          kittygram_domain: ${{ needs.deploy.outputs.kittygram_url }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          EOF

      - name: Run post-deploy tests
        run: |
          pytest -q tests/test_connection.py
          pytest -q tests/test_dockerhub_images.py

      - name: Telegram notify
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Kittygram deploy succeeded!

            Author: ${{ github.actor }}
            Terraform run: ${{ github.event.workflow_run.html_url }}
